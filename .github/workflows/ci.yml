name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          unset TRAVEL_CAT_LIVE_JOURNEY_ACCEPTANCE TRAVEL_CAT_LIVE_RENDER_SESSION TRAVEL_CAT_LIVE_PRODUCTION_ROOT
          test -d "$DEVELOPER_DIR"
          swift --version
          python3 --version
          node --version
          echo "TRAVEL_CAT_SCRATCH_ROOT=$RUNNER_TEMP/travel-cat-swift" >> "$GITHUB_ENV"
      - name: Python source contracts
        run: python3 -m unittest discover -s Scripts/tests -p '*_tests.py'
      - name: Upload tooling contracts
        run: Scripts/tests/project-upload-tools-tests.sh
      - name: Plugin contracts
        run: Scripts/verify-travel-cat-plugin.sh
      - name: Skill contracts
        run: Scripts/verify-travel-cat-skill.sh
      - name: Agent contracts
        run: Scripts/verify-agent-contract.sh
      - name: Swift tests (UTC)
        env:
          TZ: UTC
        run: |
          unset TRAVEL_CAT_LIVE_JOURNEY_ACCEPTANCE TRAVEL_CAT_LIVE_RENDER_SESSION TRAVEL_CAT_LIVE_PRODUCTION_ROOT
          Scripts/travel-cat-swift.sh test
      - name: Prompt tests (Asia/Shanghai)
        env:
          TZ: Asia/Shanghai
        run: |
          unset TRAVEL_CAT_LIVE_JOURNEY_ACCEPTANCE TRAVEL_CAT_LIVE_RENDER_SESSION TRAVEL_CAT_LIVE_PRODUCTION_ROOT
          Scripts/travel-cat-swift.sh test --filter PetTravelPromptServiceTests
      - name: Public upload audit
        run: Scripts/audit-project-upload.sh
