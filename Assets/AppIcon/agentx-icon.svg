<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
 <clipPath id="c"><rect width="1024" height="1024" rx="232"/></clipPath>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B2560"/><stop offset=".55" stop-color="#17213A"/><stop offset="1" stop-color="#0F2E33"/></linearGradient>
 <radialGradient id="neb1" cx="30%" cy="30%" r="45%"><stop offset="0" stop-color="#A48CFF" stop-opacity=".55"/><stop offset="1" stop-color="#A48CFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="neb2" cx="75%" cy="70%" r="45%"><stop offset="0" stop-color="#5EE0D4" stop-opacity=".45"/><stop offset="1" stop-color="#5EE0D4" stop-opacity="0"/></radialGradient>
 <radialGradient id="eye" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFD98F"/><stop offset=".7" stop-color="#F0A04B"/><stop offset="1" stop-color="#D9832E"/></radialGradient>
 <radialGradient id="fur" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#3A3D4A"/><stop offset="1" stop-color="#1A1B22"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<g clip-path="url(#c)">
